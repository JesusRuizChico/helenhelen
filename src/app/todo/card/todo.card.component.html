

<article class="card large-padding top-space block todo-card" 
(mouseup)="press = 'Up'"
(mousedown)="press = 'Down'"
(pressup) = "press = 'Up'"
(pressdown) = "press = 'Down'"


[@stateAnimation]="todo.status"

[@pressAnimation]="press"
(swipeleft)="completed()">
    <h4>{{todo.content}}</h4>
    <p *ngIf="todo.descripcion">{{todo.descripcion}}</p>
</article>
