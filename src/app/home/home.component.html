<div class="large-padding">
    <div *ngFor="let list of listS.lists | async" @enterState (@enterState.done)="completed()">
         <a routerLink="/list/{{list.id}}" >
        <article class="card block large-padding top-space with-badge">
            <h4>{{list.title}}</h4>

            <div class="badge">
                <span>0</span>
            </div>
        </article>
    </a>
    </div>
</div>
